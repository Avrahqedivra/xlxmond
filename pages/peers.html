<script type="text/javascript">
	listenerList = [];

	//   https://stackoverflow.com/questions/9229645/remove-duplicate-values-from-js-array
	function uniqByKeepFirst(a, key) {
		let seen = new Set();
		return a.filter(item => {
			let k = key(item);
			return seen.has(k) ? false : seen.add(k);
		});
	}

	function uniqByKeepLast(a, key) {
		return [
			...new Map(
				a.map(x => [key(x), x])
			).values()
		]
	}

	function scrollIntoViewFromId(id) {
		if (hideAllTG) {
			hideAllTG = false;
			$("#insertPoint").show();
		};

		const el = document.getElementById(id);
		if (el != null) {
			el.scrollIntoView(true);
			el.focus();
		}
	}


	function getPercentage(rowCount) {
		nbtables = $(".tgtable");
		nbrows = 0;
		for(let i=0; i < nbtables.length; i++)
			nbrows += $("#"+$(nbtables[i]).attr("id") + ' >tbody >tr').length;
		return (rowCount * 100 / nbrows) + 0.5;
	}

	function formatDate(input) {
		// Strip the duplicated weekday ("Wednesday Wed ...") so Date can parse it
		const cleaned = input.replace(/^\S+\s+/, ''); // "Wed Nov 18 22:07:25 2026"
		const date = new Date(cleaned);

		if (isNaN(date.getTime())) {
			throw new Error('Invalid date string: ' + input);
		}

		const pad = (n) => String(n).padStart(2, '0');

		const day = pad(date.getDate());
		const month = pad(date.getMonth() + 1); // getMonth() is 0-based
		const year = date.getFullYear();
		const hours = pad(date.getHours());
		const minutes = pad(date.getMinutes());

		return `${day}.${month}.${year} ${hours}:${minutes}`;
	}

	function computeOnlineTime(dateString) {
		// Parse the date string, removing the duplicated weekday ("Wednesday Wed")
		// "Wednesday Wed Nov 18 22:07:25 2026" -> "Wed Nov 18 22:07:25 2026"
		const cleaned = dateString.replace(/^\S+\s+/, '');
		const startDate = new Date(cleaned);

		if (isNaN(startDate.getTime())) {
			throw new Error('Invalid date string: ' + dateString);
		}

		const now = new Date();
		let diffMs = now - startDate;

		// Handle future dates gracefully
		const isFuture = diffMs < 0;
		diffMs = Math.abs(diffMs);

		const totalSeconds = Math.floor(diffMs / 1000);

		const days = Math.floor(totalSeconds / 86400);
		const hours = Math.floor((totalSeconds % 86400) / 3600);
		const minutes = Math.floor((totalSeconds % 3600) / 60);
		const seconds = totalSeconds % 60;

		const pad = (n) => String(n).padStart(2, '0');

		const dayPart = days === 1 ? '1 day' : `${days} days`;

		return `${isFuture ? '-' : ''}${dayPart} ${pad(hours)}:${pad(minutes)}:${pad(seconds)} s`;
	}

	function doPeers(t) {
		if (t != null) {
			let p = t.Peer;

			if (Array.isArray(p))
				peers = p;
			else
				peers = [p];

			let peersLength = peers.length;

			if (peersLength > 0) {
				for(let i=0; i < peersLength; i++) {
					var record = peers[i];
					var bgClass = "tgWhite";

					content = '<tr class=' + bgClass + '>';
						content += "<td class='tdOrder'>" + (i+1) + "</td>";
						content += "<td class='tdxlxpeer'>" + record?.Callsign + "</td>";
						content += "<td class='tdpelastheard'>" + formatDate(record?.LastHeardTime) + "</td>";
						content += "<td class='tdpelinkedfor'>" + computeOnlineTime(record?.LastHeardTime) + "</td>";
						content += "<td class='tdpeprotocol'>" + record?.Protocol + "</td>";
						content += "<td class='tdpemodule'>" + record?.LinkedModule + "</td>";
						content += "<td class='tdpeaddress'>" + record?.IP + "</td>";
					content += "</tr>";

					$("#peersBody").append(content);
				}
			}
		}
	}

	function log(msg) {
		console.log(msg);
	};

	// https://htmldom.dev/drag-to-scroll/

	pos = { top: 0, left: 0, x: 0, y: 0 };

	const mouseMoveHandler = function (e) {
    // How far the mouse has been moved
    const dx = e.clientX - pos.x;
    const dy = e.clientY - pos.y;

    // Scroll the element
    e.scrollTop = pos.top - dy;
    e.scrollLeft = pos.left - dx;
	};

	const mouseUpHandler = function (e) {
    document.removeEventListener('mousemove', mouseMoveHandler);
    document.removeEventListener('mouseup', mouseUpHandler);

    // e.style.cursor = 'grab';
    // e.style.removeProperty('user-select');
	};

	const mouseDownHandler = function(e) {
		// Change the cursor and prevent user from selecting the text
		// e.style.cursor = 'grabbing';
		// e.style.userSelect = 'none';

		pos = {
				// The current scroll
				left: e.scrollLeft,
				top: e.scrollTop,
				// Get the current mouse position
				x: e.clientX,
				y: e.clientY,
		};

		document.addEventListener('mousemove', mouseMoveHandler);
		document.addEventListener('mouseup', mouseUpHandler);
	};

	$(document).ready(function () {
		TIME_INTERVALS = 24
		
		// document ready occurs before windows.onLoad
		if (getConfigFromLocalStorage != null) {
			getConfigFromLocalStorage();

			if (document.documentElement.className != settings[0].config.theme)
					document.documentElement.className = settings[0].config.theme;
		}

		document.cookie = "SameSite=None; Secure"

		initMenubar();

		$(window).click(function (event) {
			if (event.target == document.getElementById("listenersModal"))
				$("#listenersModal").hide();
		});

		$(window).click(function (event) {
			if (event.target == document.getElementById("statisticsModal"))
				$("#statisticsModal").hide();
		});

		$(document).on("click", ".network thead", function () {
			$("#" + $(this).attr('tbodyid')).toggle(100);
		});

		$(document).on("click", ".close", function () {
			$("#statisticsModal").hide();
			$("#listenersModal").hide();
		});

		$(document).on("dblclick", "#btnlisteners", function (e) {
			if (e.ctrlKey) {
				$("#listeners tr").remove();
				var content = "";

				listenerList = uniqByKeepLast(listenerList, swl => swl.NETID);

				listenerList.forEach(swl => {
					content += "<tr class='trlisteners'><td>" + swl.CALLSIGN + "</td><td>" + swl.IP + "</td><td>" + swl
						.PORT + "</td><td>" + swl.NETID + "</td></tr>";
				});

				$("#listeners").append(content);
				$("#listenersModal").show();
			}
		});
	});

	window.onload = () => {
		listeners = 0;
		peers = [];
		mobileDevice = "__MOBILE__" == "true";

		var wsuri = "ws://" + window.location.hostname + ":__SOCKET_SERVER_PORT__?page=peers";

		$("#menubar").show();
		$("#siteHeader").show();
		$("#freqstatsdiv").show()

		function WSConnection() {
			'use strict';
			this.socket = {};
		}

		WSConnection.prototype.connect = (url) => {
			'use strict';

			return new Promise((resolve, reject) => {
				if ("WebSocket" in window)
					this.socket = new WebSocket(url);
				else if ("MozWebSocket" in window)
					this.socket = new MozWebSocket(url);
				else {
					log("Browser does not support WebSocket!");
					resolve();
				}

				this.socket.onopen = function () {
						log("Connected to " + url)
						// this.send(JSON.stringify({
						// 		"request": "peers"
						// }));
						resolve();
				};

				this.socket.onmessage = (e) => {
					var data = null;

					try {
						if (themeSettings == "auto")
							adjustTheme();

						data = JSON.parse(e.data);

						// console.log("");
						// console.log(data);
						// console.log("");

						if (data != null) {
							if (data.CONFIG) {
								if (data.CONFIG.BIGEARS)
									$("#btnlisteners").text(data.BIGEARS);

								if (data?.CONFIG?.PACKETS?.TRAFFIC?.LinkedPeers)
									doPeers(data.CONFIG.PACKETS.TRAFFIC.LinkedPeers);
							}
					}
					} catch (error) {
						log(error);
					}
				};

				socket.onerror = function (error) {
					console.log('WebSocket error: ' + error);
					reject(error);
				};

				socket.onclose = function (e) {
					log("Connection closed (wasClean = " + e.wasClean + ", code = " + e.code + ", reason = '" + e
						.reason + "')");
					this.sock = null;
				};
			});
		};

		WSConnection.prototype.disconnect = () => {
			'use strict';
			console.log("Disconnect request from local app layer");
			this.socket.close();
		};


		setTimeout(() => {
			socket = new WSConnection().connect(wsuri);
		}, 250);
	};
</script>
