<!DOCTYPE html>
<html class="__THEME__">

<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="20000" />
  <title>XLXMOND</title>

  <link rel="stylesheet" href="theme_template.css">
  <link rel="stylesheet" href="mysite_template.css">
  <meta name="description" content="Copyright (c) 2022 Jean-Michel Cohen - F4JDN" />

  <style>
    .modules {
      width: 70rem;
    }

    #xhbtables {
      margin-top: 0rem;
      height: calc(100vh - 16rem);
      overflow-y: scroll;
      width: fit-content;
      scrollbar-width: thin;
    }

    #xhbtables::-webkit-scrollbar {
      display: block;
      width: 6px;
      background-color: #404040;
    }

    #xhbtables::-webkit-scrollbar-thumb {
      background-color: #569cd6;
    }

    .left {
      text-align: left;
      padding-left: 0.5rem;
    }

    @supports (-moz-appearance:none) {
      xdiv[name="hbtables"] {
        overflow-y: scroll;
        width: fit-content;
        margin-top: 0.5rem;
        scrollbar-color: #569cd6 #404040;
      }
    }
  </style>
</head>

<body>
  <div class="center-block">
    <noscript>You must enable JavaScript</noscript>

    <div id="sitelogo" style="display:none">__SITE_LOGO__</div>

    __BUTTON_BAR__

    <div id="siteHeader" style="display:none">

      <!-- The Modal -->
      <div id="statisticsModal" class="modal">
        <!-- Modal content -->
        <div class="modal-content-statistics">
          <span class="close close-statistics">&times;</span>
          <table class="tablefixed">
            <thead id="theadStatistics" tbodyid="statistics">
              <tr class="headerRow">
                <th class="thlstg">TG</th>
                <th class="thlsCnx">Nb Cnx</th>
                <th class="thlsDelay">Total Time</th>
              </tr>
            </thead>
            <tbody id="statistics">
            </tbody>
          </table>
        </div>
      </div>

      <!-- The Modal -->
      <div id="listenersModal" class="modal">
        <!-- Modal content -->
        <div class="modal-content-listeners">
          <span class="close close-listeners">&times;</span>
          <table class="tablefixed">
            <thead id="theadListeners" tbodyid="listeners">
              <tr class="headerRow">
                <th class="thlscallsign">Callsign</th>
                <th class="thlsip">IP</th>
                <th class="thlsport">Port</th>
                <th class="thlsnetid">NetID</th>
              </tr>
            </thead>
            <tbody id="listeners">
            </tbody>
          </table>
        </div>
      </div>

      <div name="hbtables" id="hbtables">
        <div id="insertPoint">
          <table class="tables tablefixed modules" id="modules">
            <thead id="theadModules" tbodyid="modulesBody">
              <tr class="headerRow">
                <th width="80" rowspan="2">Module</th>
                <th width="130" rowspan="2">Name</th>
                <th width="65" rowspan="2">Users</th>
                <th colspan="2">DPlus</th>
                <th colspan="2">DExtra</th>
                <th colspan="2">DCS</th>
                <th width="65" rowspan="2">DMR</th>
                <th width="65" rowspan="2">YSF<br>DG-ID</th>
                <th width="100" rowspan="2">M17</th>
              </tr>
              <tr class="headerRow">
                <th width="100">URCALL</th>
                <th width="100">DTMF</th>
                <th width="100">URCALL</th>
                <th width="100">DTMF</th>
                <th width="100">URCALL</th>
                <th width="100">DTMF</th>
              </tr>
            </thead>
            <tbody id="modulesBody"></tbody>
          </table>
      </div>

      <div id="footer">
        __FOOTER__
      </div>
      <!--THIS COPYRIGHT NOTICE MUST BE DISPLAYED AS A CONDITION OF THE LICENCE GRANT FOR THIS SOFTWARE. ALL DERIVATEIVES WORKS MUST CARRY THIS NOTICE -->
    </div>
  </div>
</body>

<script type="text/javascript">
  listenerList = [];

  function doModules(data) {
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    const rows = data.modules.map((m, i) => {
      const bg = i % 2 === 0 ? '#FFFFFF' : '#F1FAFA';
      const dp = m.dplus  || {};
      const dx = m.dextra || {};
      const dc = m.dcs    || {};
      return `
        <tr class="tgWhite">
          <td>${esc(m.module)}</td>
          <td>${esc(m.name)}</td>
          <td>${esc(m.users)}</td>
          <td class="left">${esc(dp.urcall)}</td>
          <td class="left">${esc(dp.dtmf)}</td>
          <td class="left">${esc(dx.urcall)}</td>
          <td class="left">${esc(dx.dtmf)}</td>
          <td class="left">${esc(dc.urcall)}</td>
          <td class="left">${esc(dc.dtmf)}</td>
          <td class="left">${esc(m.dmr)}</td>
          <td>${esc(m.ysf_dg_id)}</td>
          <td class="left">${esc(m.m17)}</td>
        </tr>`;
    }).join('');

    $("#modulesBody").html(rows);
  }

  function log(msg) {
    console.log(msg);
  };

  // https://htmldom.dev/drag-to-scroll/

  pos = { top: 0, left: 0, x: 0, y: 0 };

  const mouseMoveHandler = function (e) {
    // How far the mouse has been moved
    const dx = e.clientX - pos.x;
    const dy = e.clientY - pos.y;

    // Scroll the element
    e.scrollTop = pos.top - dy;
    e.scrollLeft = pos.left - dx;
  };

  const mouseUpHandler = function (e) {
    document.removeEventListener('mousemove', mouseMoveHandler);
    document.removeEventListener('mouseup', mouseUpHandler);

    // e.style.cursor = 'grab';
    // e.style.removeProperty('user-select');
  };

  const mouseDownHandler = function (e) {
    // Change the cursor and prevent user from selecting the text
    // e.style.cursor = 'grabbing';
    // e.style.userSelect = 'none';

    pos = {
      // The current scroll
      left: e.scrollLeft,
      top: e.scrollTop,
      // Get the current mouse position
      x: e.clientX,
      y: e.clientY,
    };

    document.addEventListener('mousemove', mouseMoveHandler);
    document.addEventListener('mouseup', mouseUpHandler);
  };

  $(document).ready(function () {
    TIME_INTERVALS = 24

    // document ready occurs before windows.onLoad
    if (getConfigFromLocalStorage != null) {
      getConfigFromLocalStorage();

      if (document.documentElement.className != settings[0].config.theme)
        document.documentElement.className = settings[0].config.theme;
    }

    document.cookie = "SameSite=None; Secure"

    initMenubar();

    $(window).click(function (event) {
      if (event.target == document.getElementById("listenersModal"))
        $("#listenersModal").hide();
    });

    $(window).click(function (event) {
      if (event.target == document.getElementById("statisticsModal"))
        $("#statisticsModal").hide();
    });

    $(document).on("click", ".network thead", function () {
      $("#" + $(this).attr('tbodyid')).toggle(100);
    });

    $(document).on("click", ".close", function () {
      $("#statisticsModal").hide();
      $("#listenersModal").hide();
    });

    $(document).on("dblclick", "#btnlisteners", function (e) {
      if (e.ctrlKey) {
        $("#listeners tr").remove();
        var content = "";

        listenerList = uniqByKeepLast(listenerList, swl => swl.NETID);

        listenerList.forEach(swl => {
          content += "<tr class='trlisteners'><td>" + swl.CALLSIGN + "</td><td>" + swl.IP + "</td><td>" + swl
            .PORT + "</td><td>" + swl.NETID + "</td></tr>";
        });

        $("#listeners").append(content);
        $("#listenersModal").show();
      }
    });
  });

  window.onload = () => {
    listeners = 0;
    modules = [];
    mobileDevice = "__MOBILE__" == "true";

    var wsuri = "ws://" + window.location.hostname + ":__SOCKET_SERVER_PORT__?page=modules";

    $("#menubar").show();
    $("#siteHeader").show();
    $("#freqstatsdiv").show()

    function WSConnection() {
      'use strict';
      this.socket = {};
    }

    WSConnection.prototype.connect = (url) => {
      'use strict';

      return new Promise((resolve, reject) => {
        if ("WebSocket" in window)
          this.socket = new WebSocket(url);
        else if ("MozWebSocket" in window)
          this.socket = new MozWebSocket(url);
        else {
          log("Browser does not support WebSocket!");
          resolve();
        }

        this.socket.onopen = function () {
          log("Connected to " + url)
          // this.send(JSON.stringify({
          // 		"request": "modules"
          // }));
          resolve();
        };

        this.socket.onmessage = (e) => {
          var data = null;

          try {
            if (themeSettings == "auto")
              adjustTheme();

            data = JSON.parse(e.data);

            // console.log("");
            // console.log(data);
            // console.log("");

            if (data != null) {
              if (data.CONFIG) {
                if (data.CONFIG.BIGEARS)
                  $("#btnlisteners").text(data.BIGEARS);

                if (data.CONFIG.MODULES)
                  doModules(data.CONFIG.MODULES);
              }
            }
          } catch (error) {
            log(error);
          }
        };

        socket.onerror = function (error) {
          console.log('WebSocket error: ' + error);
          reject(error);
        };

        socket.onclose = function (e) {
          log("Connection closed (wasClean = " + e.wasClean + ", code = " + e.code + ", reason = '" + e
            .reason + "')");
          this.sock = null;
        };
      });
    };

    WSConnection.prototype.disconnect = () => {
      'use strict';
      console.log("Disconnect request from local app layer");
      this.socket.close();
    };


    setTimeout(() => {
      socket = new WSConnection().connect(wsuri);
    }, 250);
  };
</script>

</html>
